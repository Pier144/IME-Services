# Deploy su Netlify.

[build]
  # Lo stesso di sempre: `prisma generate && next build`.
  command = "npm run build"

[build.environment]
  # package.json chiede Node >= 20.9. Fissata per non dipendere dal default
  # di Netlify, che cambia nel tempo e cambierebbe la build sotto i piedi.
  NODE_VERSION = "22"

# Il runtime che trasforma l'output di Next.js in funzioni e pagine servibili.
# Netlify di norma lo installa da solo riconoscendo il framework, ma qui e'
# dichiarato esplicitamente perche' la prima volta non e' scattato.
#
# La versione non va fissata: Netlify aggiorna l'adattatore a ogni build e
# copre tutte le versioni di Next.js dalla 13.5 in avanti.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# `publish` NON va impostata. La documentazione e' esplicita: la decide il
# runtime. Fissandola a mano su ".next" Netlify serve quella cartella come
# fosse un sito statico qualsiasi: non avendo un index.html in radice, ogni
# indirizzo risponde 404 — home, pagine, /robots.txt e persino i file dentro
# public/. Il sintomo e' un deploy verde e un sito interamente irraggiungibile.

# Le migrazioni non stanno nel comando di build, come su Vercel e per lo
# stesso motivo: Netlify usa lo stesso comando per la produzione e per le
# anteprime dei branch. Finche' le anteprime puntano al database di
# produzione, una migrazione partita da un'anteprima ne cambierebbe lo schema
# prima ancora della revisione. Si applicano a mano con `npm run db:deploy`.
#
# Da fare una volta sola nel pannello, e non si puo' scrivere qui:
# Project configuration > Build & deploy > Continuous deployment >
# Functions region > Frankfurt (fra). Il default e' us-east-2 (Ohio), e con
# il database a Francoforte ogni query attraverserebbe l'Atlantico.
